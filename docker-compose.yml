# Stack minimum. Database saat ini SQLite di volume /data (lihat docs/DECISIONS.md untuk jalur ke PostgreSQL/Redis/S3).
services:
  api:
    build: .
    env_file: .env
    environment: { NODE_ENV: production, DATA_DIR: /data, TRUST_PROXY: "1" }
    volumes: [ "vcsdata:/data" ]
    restart: unless-stopped
    expose: ["4000"]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes: [ "./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "/etc/letsencrypt:/etc/letsencrypt:ro" ]
    restart: unless-stopped
  coturn:                       # opsional, hanya bila punya IP publik: docker compose --profile coturn up -d
    profiles: ["coturn"]
    image: coturn/coturn:4.6
    network_mode: host
    volumes: [ "./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro" ]
    restart: unless-stopped
volumes: { vcsdata: {} }
