# Contoh reverse proxy (HTTPS wajib: WebRTC & mikrofon butuh secure context).
server { listen 80; server_name example.com; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name example.com;
  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  client_max_body_size 6m;            # foto maks 5 MB
  location /api/v1/call-signaling {   # WSS
    proxy_pass http://api:4000; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 3600s;
  }
  location / { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
}
